name: Update NWS San Juan Image

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch latest NWS image
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: node scripts/fetch-nws.js

      - name: Commit updated image
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add public/nws-latest.jpg
          git add public/nws-latest.json

          git diff --cached --quiet || git commit -m "Update NWS San Juan advisory image"
          git push
