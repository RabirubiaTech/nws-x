name: NWS Graphicast Latest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  graphicast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm install axios sharp tesseract.js

      - name: Fetch Latest Graphicast
        run: |

          mkdir -p public/weather

          node <<'EOF'

          const fs = require("fs");
          const axios = require("axios");
          const sharp = require("sharp");
          const Tesseract = require("tesseract.js");

          const urls = [
            "https://www.weather.gov/images/sju/graphicast/1.png",
            "https://www.weather.gov/images/sju/graphicast/2.png",
            "https://www.weather.gov/images/sju/graphicast/3.png"
          ];

          async function download(url) {

            const response = await axios.get(
              url,
              {
                responseType: "arraybuffer"
              }
            );

            return Buffer.from(response.data);
          }

          async function readTimestamp(buffer,index) {

            const crop =
              await sharp(buffer)
              .extract({
                left: 700,
                top: 500,
                width: 300,
                height: 250
              })
              .png()
              .toBuffer();

            const ocr =
              await Tesseract.recognize(
                crop,
                "eng"
              );

            return {
              index,
              text:
                ocr.data.text || "",
              buffer
            };
          }

          (async()=>{

            const results=[];

            for(
              let i=0;
              i<urls.length;
              i++
            ){

              console.log(
                "Checking",
                urls[i]
              );

              const image=
                await download(
                  urls[i]
                );

              const info=
                await readTimestamp(
                  image,
                  i
                );

              results.push(info);

              console.log(
                info.text
              );
            }

            const today =
              new Date()
              .toLocaleDateString(
                "en-US",
                {
                  timeZone:
                   "America/Puerto_Rico"
                }
              );

            let winner =
              results[0];

            for(
              const r of results
            ){

              if(
                r.text.length >
                winner.text.length
              ){
                winner=r;
              }
            }

            fs.writeFileSync(
              "public/weather/nws-latest.png",
              winner.buffer
            );

            fs.writeFileSync(
              "public/weather/nws-latest.json",
              JSON.stringify(
                {
                  updated:
                    new Date()
                    .toISOString(),
                  source:
                    urls[winner.index],
                  ocr:
                    winner.text
                },
                null,
                2
              )
            );

            console.log(
              "Saved:",
              urls[winner.index]
            );

          })()
          .catch(err=>{
            console.error(err);
            process.exit(1);
          });

          EOF

      - name: Verify Files
        run: |
          ls -lah public/weather

      - name: Commit Changes
        run: |

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add public/weather

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update latest NWS graphicast"
          git push
