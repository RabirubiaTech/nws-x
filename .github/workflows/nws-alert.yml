name: NWS Graphicast Images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  graphicast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install axios

      - name: Fetch Graphicast Images
        run: |
          mkdir -p public/weather

          node <<'EOF'

          const fs = require('fs');
          const axios = require('axios');

          const urls = [
            'https://www.weather.gov/images/sju/graphicast/1.png',
            'https://www.weather.gov/images/sju/graphicast/2.png',
            'https://www.weather.gov/images/sju/graphicast/3.png',
            'https://www.weather.gov/images/sju/graphicast/4.png',
            'https://www.weather.gov/images/sju/graphicast/5.png',
            'https://www.weather.gov/images/sju/graphicast/6.png',
            'https://www.weather.gov/images/sju/graphicast/7.png'
          ];

          async function getImageInfo(url) {

            try {

              const head = await axios.head(url);

              const modified =
                head.headers['last-modified'];

              if (!modified) {
                return null;
              }

              const image =
                await axios.get(url,{
                  responseType:'arraybuffer'
                });

              return {
                url,
                modified:
                  new Date(modified),
                buffer:
                  Buffer.from(image.data)
              };

            } catch(error) {

              console.log(
                'Skipping',
                url
              );

              return null;
            }
          }

          (async()=>{

            const today =
              new Date()
                .toLocaleDateString(
                  'en-US',
                  {
                    timeZone:
                      'America/Puerto_Rico'
                  }
                );

            const results = [];

            for (const url of urls) {

              const info =
                await getImageInfo(url);

              if (!info)
                continue;

              const fileDate =
                info.modified
                    .toLocaleDateString(
                      'en-US',
                      {
                        timeZone:
                         'America/Puerto_Rico'
                      }
                    );

              if (fileDate === today) {

                results.push(info);

              }
            }

            results.sort(
              (a,b)=>
                b.modified - a.modified
            );

            const manifest = [];

            let counter = 1;

            for (const image of results) {

              const filename =
                `nws-latest-${counter}.png`;

              fs.writeFileSync(
                `public/weather/${filename}`,
                image.buffer
              );

              manifest.push({
                file:
                  filename,
                source:
                  image.url,
                modified:
                  image.modified
                    .toISOString()
              });

              counter++;
            }

            fs.writeFileSync(
              'public/weather/nws-latest.json',
              JSON.stringify(
                {
                  updated:
                    new Date()
                      .toISOString(),
                  count:
                    manifest.length,
                  images:
                    manifest
                },
                null,
                2
              )
            );

            console.log(
              `Saved ${manifest.length} images`
            );

          })()
          .catch(error=>{
            console.error(error);
            process.exit(1);
          });

          EOF

      - name: Verify Files
        run: |
          ls -lah public/weather

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add public/weather

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update NWS Graphicast images"
          git push
