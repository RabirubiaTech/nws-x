name: NWS San Juan Alert Image

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Create Directories
        run: |
          mkdir -p public/weather
          mkdir -p scripts

          # Create placeholder file if folder is empty
          touch public/weather/.gitkeep

      - name: Create Scraper Script
        run: |
          cat > scripts/fetch-nws.js << 'EOF'

          const fs = require('fs');
          const https = require('https');
          const { chromium } = require('playwright');

          const KEYWORDS = [
            'warning',
            'watch',
            'advisory',
            'flood',
            'flooding',
            'storm',
            'severe',
            'thunderstorm',
            'marine',
            'hurricane',
            'tropical'
          ];

          async function downloadImage(url, destination) {

            return new Promise((resolve, reject) => {

              const file = fs.createWriteStream(destination);

              https.get(url, response => {

                if (response.statusCode !== 200) {
                  reject(
                    new Error(
                      `Download failed: ${response.statusCode}`
                    )
                  );
                  return;
                }

                response.pipe(file);

                file.on('finish', () => {
                  file.close(resolve);
                });

              }).on('error', reject);
            });
          }

          async function createStatus(message) {

            fs.writeFileSync(
              'public/weather/nws-status.json',
              JSON.stringify(
                {
                  updated: new Date().toISOString(),
                  status: message
                },
                null,
                2
              )
            );
          }

          async function main() {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1400,
                height: 2500
              }
            });

            try {

              console.log("Opening X...");

              await page.goto(
                'https://x.com/NWSSanJuan',
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 30000
                }
              );

              await page.waitForTimeout(5000);

              await page.screenshot({
                path: 'public/weather/debug.png',
                fullPage: true
              });

              console.log("Page title:");
              console.log(await page.title());

              const result = await page.evaluate((keywords) => {

                const DAY_MS =
                  24 * 60 * 60 * 1000;

                const tweets =
                  Array.from(
                    document.querySelectorAll('article')
                  );

                for (const tweet of tweets) {

                  const timeNode =
                    tweet.querySelector('time');

                  if (!timeNode) continue;

                  const published =
                    new Date(
                      timeNode.getAttribute('datetime')
                    );

                  if (
                    Date.now() -
                    published.getTime() >
                    DAY_MS
                  ) {
                    continue;
                  }

                  const text =
                    tweet.innerText.toLowerCase();

                  const matched =
                    keywords.some(keyword =>
                      text.includes(keyword)
                    );

                  if (!matched) continue;

                  const image =
                    tweet.querySelector(
                      'img[src*="pbs.twimg.com/media"]'
                    );

                  if (!image) continue;

                  return {
                    imageUrl: image.src,
                    text: tweet.innerText,
                    timestamp:
                      published.toISOString()
                  };
                }

                return null;

              }, KEYWORDS);

              await browser.close();

              if (!result) {

                console.log(
                  "No qualifying image found."
                );

                await createStatus(
                  "No weather alert image found in last 24 hours."
                );

                process.exit(0);
              }

              console.log(
                `Downloading image: ${result.imageUrl}`
              );

              await downloadImage(
                result.imageUrl,
                'public/weather/nws-latest.jpg'
              );

              fs.writeFileSync(
                'public/weather/nws-latest.json',
                JSON.stringify(
                  {
                    updated:
                      new Date().toISOString(),
                    source:
                      'https://x.com/NWSSanJuan',
                    postDate:
                      result.timestamp,
                    text:
                      result.text,
                    image:
                      '/weather/nws-latest.jpg'
                  },
                  null,
                  2
                )
              );

              await createStatus(
                "Latest alert image updated successfully."
              );

            } catch (error) {

              console.error(error);

              await createStatus(
                `Error: ${error.message}`
              );

              process.exit(0);
            }
          }

          main();

          EOF

      - name: Execute Scraper
        run: node scripts/fetch-nws.js

      - name: Upload Debug Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: nws-debug
          path: public/weather/debug.png
          if-no-files-found: ignore

      - name: Commit Changes
        run: |

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ ! -d "public/weather" ]; then
            echo "Directory missing"
            exit 0
          fi

          FILE_COUNT=$(find public/weather -type f | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No files generated"
            exit 0
          fi

          git add public/weather

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update NWS San Juan alert image"

          git push
