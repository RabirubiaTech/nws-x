name: NWS San Juan Alert Image

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Create Directories
        run: |
          mkdir -p public/weather
          mkdir -p scripts

      - name: Create Scraper
        run: |
          cat > scripts/fetch-nws.js << 'EOF'

          const fs = require('fs');
          const https = require('https');
          const { chromium } = require('playwright');

          const KEYWORDS = [
            'warning',
            'watch',
            'advisory',
            'flood',
            'flooding',
            'storm',
            'severe',
            'thunderstorm',
            'marine',
            'hurricane',
            'tropical'
          ];

          async function downloadImage(url, output) {
            return new Promise((resolve, reject) => {

              const file = fs.createWriteStream(output);

              https.get(url, response => {

                if (response.statusCode !== 200) {
                  return reject(
                    new Error(
                      `Image download failed (${response.statusCode})`
                    )
                  );
                }

                response.pipe(file);

                file.on('finish', () => {
                  file.close(resolve);
                });

              }).on('error', reject);

            });
          }

          async function main() {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 2000
              }
            });

            console.log("Loading page...");

            await page.goto(
              'https://x.com/NWSSanJuan',
              {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              }
            );

            await page.waitForTimeout(5000);

            const result = await page.evaluate((keywords) => {

              const ONE_DAY =
                24 * 60 * 60 * 1000;

              const tweets =
                Array.from(
                  document.querySelectorAll('article')
                );

              for (const tweet of tweets) {

                const time =
                  tweet.querySelector('time');

                if (!time) continue;

                const published =
                  new Date(
                    time.getAttribute('datetime')
                  );

                if (
                  Date.now() -
                  published.getTime() >
                  ONE_DAY
                ) {
                  continue;
                }

                const text =
                  tweet.innerText.toLowerCase();

                const match =
                  keywords.some(keyword =>
                    text.includes(keyword)
                  );

                if (!match) continue;

                const image =
                  tweet.querySelector(
                    'img[src*="pbs.twimg.com/media"]'
                  );

                if (!image) continue;

                return {
                  imageUrl: image.src,
                  text: tweet.innerText,
                  datetime:
                    published.toISOString()
                };
              }

              return null;

            }, KEYWORDS);

            await browser.close();

            if (!result) {

              console.log(
                'No matching alert image found in last 24 hours.'
              );

              process.exit(0);
            }

            console.log(
              `Downloading image: ${result.imageUrl}`
            );

            await downloadImage(
              result.imageUrl,
              'public/weather/nws-latest.jpg'
            );

            fs.writeFileSync(
              'public/weather/nws-latest.json',
              JSON.stringify(
                {
                  updated:
                    new Date().toISOString(),
                  source:
                    'https://x.com/NWSSanJuan',
                  alertDate:
                    result.datetime,
                  text:
                    result.text,
                  image:
                    '/weather/nws-latest.jpg'
                },
                null,
                2
              )
            );

            console.log(
              'Weather image updated successfully.'
            );
          }

          main()
            .then(() => process.exit(0))
            .catch(error => {
              console.error(error);
              process.exit(1);
            });

          EOF

      - name: Run Scraper
        run: node scripts/fetch-nws.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add public/weather/*

          git diff --cached --quiet && exit 0

          git commit -m "Update NWS San Juan image"
          git push
