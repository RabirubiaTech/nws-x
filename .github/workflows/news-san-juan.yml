name: Rabirubia Weather Alert Card

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install axios sharp

      - name: Create Output Folder
        run: |
          mkdir -p public/weather

      - name: Run Generator
        run: node scripts/generate-alert.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add public/weather

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update weather alert card"
          git push
