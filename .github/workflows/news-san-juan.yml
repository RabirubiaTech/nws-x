name: NOAA Alert Graphic

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install axios sharp

      - name: Generate Alert Graphic
        run: |
          mkdir -p public/weather

          node <<'EOF'
          const fs=require('fs');
          const axios=require('axios');
          const sharp=require('sharp');

          function esc(s=''){
            return s.replace(/&/g,'&amp;')
                    .replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;');
          }

          function scene(event){

            const e=(event||'').toLowerCase();

            if(e.includes('heat')){
              return `
                <circle cx="860" cy="180" r="110" fill="#ffd166"/>
                <circle cx="860" cy="180" r="180" fill="#ffd166" opacity=".15"/>
                <circle cx="860" cy="180" r="250" fill="#ffd166" opacity=".07"/>
              `;
            }

            if(
              e.includes('flood') ||
              e.includes('surf') ||
              e.includes('rip')
            ){
              return `
                <path d="M0 760 Q180 680 360 780 T720 760 T1080 820 L1080 1350 L0 1350 Z"
                  fill="#0096c7"/>

                <path d="M0 930 Q180 850 360 940 T720 930 T1080 980 L1080 1350 L0 1350 Z"
                  fill="#48cae4"/>

                <path d="M0 1080 Q180 1020 360 1100 T720 1080 T1080 1140 L1080 1350 L0 1350 Z"
                  fill="#90e0ef" opacity=".7"/>
              `;
            }

            if(
              e.includes('hurricane') ||
              e.includes('tropical')
            ){
              return `
                <circle cx="540" cy="320" r="220"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="28"
                  opacity=".20"/>

                <circle cx="540" cy="320" r="140"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="22"
                  opacity=".18"/>

                <circle cx="540" cy="320" r="60"
                  fill="#ffffff"
                  opacity=".15"/>
              `;
            }

            if(
              e.includes('storm') ||
              e.includes('thunderstorm')
            ){
              return `
                <ellipse cx="560" cy="240"
                  rx="340" ry="110"
                  fill="#495057"/>

                <ellipse cx="430" cy="300"
                  rx="240" ry="80"
                  fill="#6c757d"/>

                <path d="
                  M630 170
                  L570 310
                  L660 310
                  L550 510"
                  stroke="#ffd60a"
                  stroke-width="18"
                  fill="none"/>
              `;
            }

            return '';
          }

          (async()=>{

            const r=await axios.get(
              'https://api.weather.gov/alerts/active?area=PR',
              {
                headers:{
                  'User-Agent':'rabirubiawx.com'
                }
              }
            );

            const alert=
              r.data.features?.[0]?.properties || {
                event:'No Active Alerts',
                headline:'No active alerts for Puerto Rico.',
                severity:'Information'
              };

            const severity=(alert.severity||'').toLowerCase();

            let color='#00b4d8';

            if(severity==='extreme') color='#d90429';
            else if(severity==='severe') color='#f77f00';

            const svg=`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="1080"
                 height="1350">

              <defs>
                <linearGradient id="bg"
                  x1="0%" y1="0%"
                  x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#001233"/>
                  <stop offset="100%" stop-color="#003566"/>
                </linearGradient>
              </defs>

              <rect
                width="1080"
                height="1350"
                fill="url(#bg)"/>

              <text
                x="540"
                y="760"
                text-anchor="middle"
                fill="white"
                opacity=".04"
                font-size="520"
                font-family="Arial">
                PR
              </text>

              ${scene(alert.event)}

              <path d="
                M0 980
                Q180 900 360 1000
                T720 990
                T1080 1060
                L1080 1350
                L0 1350 Z"
                fill="#0077b6"/>

              <path d="
                M0 1090
                Q180 1030 360 1120
                T720 1100
                T1080 1170
                L1080 1350
                L0 1350 Z"
                fill="#48cae4"
                opacity=".8"/>

              <text
                x="50"
                y="95"
                fill="#90e0ef"
                font-size="42"
                font-weight="bold">
                🌊 Rabirubia Weather
              </text>

              <rect
                x="50"
                y="130"
                width="980"
                height="120"
                rx="18"
                fill="${color}"/>

              <text
                x="80"
                y="205"
                fill="white"
                font-size="62"
                font-weight="bold">
                ${esc(alert.event)}
              </text>

              <foreignObject
                x="50"
                y="320"
                width="960"
                height="300">

                <div xmlns="http://www.w3.org/1999/xhtml"
                  style="
                    color:white;
                    font-family:Arial;
                    font-size:42px;
                    font-weight:bold;
                    line-height:1.2;">
                    ${esc((alert.headline||'').substring(0,140))}
                </div>

              </foreignObject>

              <text
                x="50"
                y="1020"
                fill="white"
                font-size="34">
                Severity: ${esc(alert.severity||'Information')}
              </text>

              <rect
                x="0"
                y="1240"
                width="1080"
                height="110"
                fill="#001220"/>

              <text
                x="540"
                y="1298"
                text-anchor="middle"
                fill="white"
                font-size="42"
                font-weight="bold">
                rabirubiawx.com
              </text>

              <text
                x="540"
                y="1332"
                text-anchor="middle"
                fill="#90e0ef"
                font-size="20">
                Puerto Rico Weather • Marine • Tropical
              </text>

            </svg>`;

            await sharp(Buffer.from(svg))
              .png()
              .toFile('public/weather/nws-latest.png');

            fs.writeFileSync(
              'public/weather/nws-latest.json',
              JSON.stringify(alert,null,2)
            );

          })();

          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add public/weather

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update weather graphic"
          git push
